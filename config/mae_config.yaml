experiment_name: "mae_pretrain_efficientnetv2_s_4ch"

model:
  backbone: "efficientnetv2_s"        # timm id; MAE script supports ViT and CNN (e.g., efficientnetv2_s)
  in_channels: 4                       # CLAHE | tophat | blackhat | sharpness (trainv4 recipe)
  input_size: 256                     # spatial resolution fed to the encoder
  patch_size: 32                       # auto-adjusted at runtime to match backbone token grid

  # MAE decoder — lightweight, 8 blocks is original paper; 4 is fine for downstream segmentation
  decoder_embed_dim: 512
  decoder_depth: 4                     # number of transformer blocks in the decoder
  decoder_num_heads: 16

data:
  json_path: "data/ARCADE/processed/dataset.json"
  root_dir: "."
  sources:                             # which JSON sources to pull from (all unlabelled)
    - coronarydominance
    - syntax
    - cadica
    - extra
  split: "train"

  batch_size: 128                      # per-GPU batch; increase to 64 if VRAM allows
  desired_batch_size: 256              # effective batch (grad accum if needed)
  num_workers: 12
  pin_memory: true

  # MAE masking
  mask_ratio: 0.75                     # fraction of patches to mask (original MAE: 0.75)

  # 4-channel preprocessing settings (passed to build_4channel_tensor)
  morph_ksize: 15                      # structuring element for tophat/blackhat
  clahe_clip: 2.0
  clahe_grid: 8

  # Source-image augmentation (applied before masking)
  aug_hflip: 0.5
  aug_vflip: 0.5
  aug_brightness: 0.6                  # prob of random brightness jitter
  aug_contrast: 0.4
  aug_blur: 0.3

optimizer:
  lr: 1.5e-4                           # base LR; scaled as lr * batch/256
  min_lr: 1.0e-6                       # final LR at end of cosine decay
  weight_decay: 0.05
  warmup_epochs: 20
  epochs: 200
  clip_grad: 3.0                       # 0 to disable grad clipping
  betas: [0.9, 0.95]                   # AdamW betas (original MAE uses 0.95 for beta2)

system:
  device: "cuda"
  seed: 42
  amp: true                            # bfloat16 mixed precision
  gradient_checkpointing: false        # enable if OOM on larger backbones
  save_dir: "checkpoints/mae"
  save_every: 25                       # checkpoint/snapshot every N epochs
  reconstruction_every: 1              # log reconstruction grid every N epochs
  log_every: 20                        # TensorBoard write interval (batches)

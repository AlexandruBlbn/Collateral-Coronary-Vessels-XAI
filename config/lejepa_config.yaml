# LeJEPA + V-JEPA 2.1 pretraining config
# Pure JEPA + SIGReg on grayscale XCA images
experiment_name: "lejepa_vjepa21_pretrain"

model:
  backbone: "vit_small"
  proj_dim: 256
  in_channels: 1
  input_size: 256
  # V-JEPA 2.1 deep supervision (set False for pure LeJEPA)
  deep_supervision: True
  deep_supervision_out_indices: [3, 6, 9, 11]

data:
  base_dataset_json: "data/ARCADE/processed/dataset.json"
  crops_json_path: "data/ARCADE/processed/dataset_crops.json"
  root_dir: "."
  num_global: 2
  num_local: 4
  global_size: 256
  local_size: 96
  max_jitter: 4
  num_vessel_classes: 26
  # Frangi is disabled — pure JEPA + SIGReg on grayscale
  use_frangi: False
  batch_size: 8
  num_workers: 4
  pin_memory: True
  drop_last: True
  persistent_workers: True
  prefetch_factor: 2
  max_samples: "all"

lejepa:
  lamb: 0.05
  sigreg_knots: 64
  sigreg_t_max: 4.0
  sigreg_num_projections: 16

optimizer:
  lr: 3.0e-4
  weight_decay: 0.05
  betas: [0.9, 0.999]
  epochs: 300
  warmup_epochs: 10

training:
  accum_steps: 2
  grad_clip: 1.0
  log_every: 20
  attention_log_every: 200
  save_every: 10

system:
  device: "cuda"
  precision: "bfloat16"
  seed: 42
  save_dir: "./checkpoints/lejepa/"
  resume: ""

<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vizualizare — {{ filename }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script>
const fn = {{ filename | tojson }};
const on = {{ (overlay_name or '') | tojson }};
</script>
</head>
<body>
<nav>
<a href="/" class="logo">🫀 Coronary AI</a>
<span class="sub">Vizualizare medicala</span>
</nav>
<main class="vl">

<div class="cfb">
<div class="cfbs done"><span>📸 Original</span><small>Criptat AES+RSA</small></div><span class="cfa">→</span>
<div class="cfbs done"><span>☁️ AI</span><small>Pipeline</small></div><span class="cfa">→</span>
<div class="cfbs done"><span>🔒 Rezultat</span><small>Criptat</small></div><span class="cfa">→</span>
<div class="cfbs active"><span>👨‍⚕️ Medic</span><small>Decriptat</small></div>
</div>

<div id="cw">
  <div id="viewer-viewport">
    <img src="/original/{{ filename }}" id="orig">
    <img src="{{ url_for('result_image', filename=filename, img_name=overlay_name.replace('.png','_vessel.png')) }}" id="vessel" style="display:none">
    <img src="{{ url_for('result_image', filename=filename, img_name=overlay_name.replace('.png','_stenosis.png')) }}" id="stenosis">
  </div>
</div>

<div class="side">
<label class="tl"><input type="checkbox" id="tv"><span class="ts"></span><span style="color:#22c55e">Artere</span></label>
<label class="tl"><input type="checkbox" id="ts" checked><span class="ts"></span><span style="color:#ef4444">Stenoze</span></label>
<div class="sep"></div>
<button class="bi" id="zi">🔍+</button>
<button class="bi" id="zo">🔍−</button>
<button class="bi" id="rv">⟲ Reset</button>
<span id="zl">100%</span>
</div>

</main>
<script>
(function(){
const cw = document.getElementById('cw');
const viewport = document.getElementById('viewer-viewport');
const vessel = document.getElementById('vessel');
const stenosis = document.getElementById('stenosis');
let s = 1, ox = 0, oy = 0;

function zoom(f) {
  const ns = Math.max(0.1, Math.min(10, s * f));
  const rect = cw.getBoundingClientRect();
  const cx = rect.width / 2, cy = rect.height / 2;
  ox = cx - (cx - ox) * (ns / s);
  oy = cy - (cy - oy) * (ns / s);
  s = ns;
  apply();
}

function apply() {
  viewport.style.transform = `translate(${ox}px, ${oy}px) scale(${s})`;
  document.getElementById('zl').textContent = Math.round(s * 100) + '%';
}

function reset() {
  s = 1; ox = 0; oy = 0; apply();
}

cw.onwheel = function(e) {
  e.preventDefault();
  zoom(e.deltaY < 0 ? 1.15 : 0.87);
};

document.getElementById('zi').onclick = () => zoom(1.3);
document.getElementById('zo').onclick = () => zoom(1/1.3);
document.getElementById('rv').onclick = reset;

document.getElementById('tv').onchange = function() {
  vessel.style.display = this.checked ? 'block' : 'none';
};
document.getElementById('ts').onchange = function() {
  stenosis.style.display = this.checked ? 'block' : 'none';
};
})();
</script>
</body>
</html>

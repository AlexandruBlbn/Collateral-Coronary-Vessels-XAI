<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coronary AI — Detectie Stenoza</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav><a href="/" class="logo">🫀 Coronary AI</a></nav>
<main>
<div class="hero">
<h1>Incarca o angiograma</h1>
<p>Criptare end-to-end AES-256 + RSA-2048 → Pipeline AI → Vizualizare medicala</p>
<form action="/upload" method="POST" enctype="multipart/form-data">
<div style="margin:2rem 0">
<input type="file" name="file" accept="image/*" style="color:#e2e8f0;font-size:1rem;padding:.5rem;background:#1e293b;border:1px solid #334155;border-radius:8px;width:100%">
</div>
<button type="submit" class="btn btn-big">Analizeaza</button>
</form>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
</div>
</main>
</body>
</html>
